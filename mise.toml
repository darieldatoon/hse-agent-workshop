# One toolchain file for the whole repo. `mise trust && mise install && mise run setup`.
# Python comes from uv (.python-version), not mise. Participants need none of this: the
# notebooks run in Colab. This is for maintainers and the instructor.

[tools]
uv = "0.12"
lefthook = "2"
terraform = "1.11"
"github:SocketDev/sfw-free" = { version = "1.15.2", bin = "sfw" }
"github:langchain-ai/langsmith-cli" = { version = "v0.2.60", bin = "langsmith" }

[tasks.setup]
description = "Install the notebook stack, the seeder and the dev tools, then git hooks"
run = ["sfw uv sync --all-packages --all-groups", "lefthook install"]

[tasks.lab]
description = "Open the notebooks in Jupyter Lab, the local alternative to Colab"
run = "uv run jupyter lab notebooks"

[tasks.check]
description = "Ruff, ty and the notebook lint"
run = [
  "uv run --all-packages ruff format --check seed",
  "uv run --all-packages ruff check .",
  "uv run --all-packages ty check",
  "python3 tools/check_notebooks.py",
]

[tasks.seed]
description = "Seed chosen workspaces, or print the answer key (pass options after --)"
run = "uv run --all-packages --env-file .env hse-seed"

[tasks."infra:init"]
description = "Install the LangSmith Terraform provider"
dir = "infra"
run = "terraform init"

[tasks."workshop:plan"]
description = "Dry run: the Terraform plan, then who would be invited"
dir = "infra"
# The provider reads the org admin key from LANGSMITH_API_KEY in ../.env; Terraform reads the
# OpenAI key only under a TF_VAR_ name.
run = [
  "set -a && . ../.env && set +a && TF_VAR_openai_api_key=\"$OPENAI_API_KEY\" terraform plan",
  "uv run --env-file ../.env python invite.py",
]

[tasks."workshop:up"]
description = "Workspaces, role, secrets and caps; invite everyone; seed new workspaces. Safe to re-run"
dir = "infra"
run = [
  "set -a && . ../.env && set +a && TF_VAR_openai_api_key=\"$OPENAI_API_KEY\" terraform apply",
  "uv run --env-file ../.env python invite.py --send",
  "uv run --all-packages --env-file ../.env hse-seed upload --from-terraform . --skip-seeded",
]

[tasks."workshop:reseed"]
description = "Fresh traces in every workspace, the morning of the lab. Wipes attendees' flags"
dir = "infra"
run = "uv run --all-packages --env-file ../.env hse-seed upload --from-terraform ."
